name: EchoLake CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate synthetic sample
        run: python3 scripts/generate_synthetic_finance.py --rows 250 --output data/raw/transactions.csv
      - name: Validate project structure
        run: python3 scripts/validate_project.py
